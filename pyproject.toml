[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OstravaMag"
version = "0.1.0"
description = "A short description of your project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
"gpaw==25.7.0",
"matplotlib==3.11.1",
"numpy<2",
]

[project.scripts]
OstravaMag = "src.OstravaMag:OstravaMag"

[tool.setuptools.packages.find]
where = ["."]
